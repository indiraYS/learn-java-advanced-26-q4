# ===================================================================
# LOCAL - developer laptop.
# In-memory H2 (PostgreSQL compatibility mode), no external services
# required beyond the mock OAuth2 server on :8081.
# ===================================================================
spring:
  datasource:
    url: jdbc:h2:mem:learn_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: learn-pool-local
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/issuer-a

server:
  error:
    # Verbose errors are fine locally; disabled in stg/prod.
    include-message: always

logging:
  level:
    indira.yessimova.learn: DEBUG
    org.springframework.security: DEBUG
