# ===================================================================
# DEV - shared development environment.
# Real PostgreSQL. Credentials come from the environment; the defaults
# here are only convenience values for a local docker-compose Postgres.
# ===================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learn_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:learn}
    password: ${DB_PASSWORD:learn}
    hikari:
      pool-name: learn-pool-dev
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    # Dev databases drift as migrations are reworked; tolerate that here.
    baseline-on-migrate: true
    clean-disabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8081/issuer-a}

server:
  error:
    include-message: always

logging:
  level:
    indira.yessimova.learn: DEBUG
