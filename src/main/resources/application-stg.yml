# ===================================================================
# STG - staging / pre-production.
# Mirrors prod as closely as possible. All connection details and
# secrets MUST be supplied by the environment (no usable defaults).
# ===================================================================
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: learn-pool-stg
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    baseline-on-migrate: false
    clean-disabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}

server:
  error:
    # Do not leak exception messages to clients.
    include-message: never
    include-stacktrace: never

logging:
  level:
    indira.yessimova.learn: INFO
