services:
  oauth-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.0
    container_name: oauth-mock
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      JSON_CONFIG: >
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "issuer-a",
              "tokenExpiry": 300,
              "requestMappings": [
                {
                  "requestParam": "role",
                  "match": "ADMIN",
                  "claims": {
                    "role": "ADMIN"
                  }
                },
                {
                  "requestParam": "role",
                  "match": "USER",
                  "claims": {
                    "role": "USER"
                  }
                }
              ]
            }
          ]
        }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/learn/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
